_BASE_: [
  '../datasets/aic2026_qadepth.yml',
  '../runtime_aic2026.yml',
  '_base_/optimizer.yml',
  '_base_/damsdet_r50vd.yml',
  '_base_/damsdet_e6a_sol_reader_960_letterbox.yml',
]

save_dir: output/E6a_Sol_RGBIR_DAMSDet_960_dual_o2m
output_eval: output/E6a_Sol_RGBIR_DAMSDet_960_dual_o2m/eval_latest
pretrain_weights: weights/coco_pretrain_weights.pdparams
classwise: true
seed: 2026
find_unused_parameters: True
log_iter: 20
snapshot_epoch: 8
epoch: 72

LearningRate:
  base_lr: 0.0001
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [48, 64]
    use_warmup: true
  - !LinearWarmup
    start_factor: 0.001
    steps: 1000

eval_size: [960, 960]
DETRPostProcess:
  bbox_decode_type: pad

DAMSDet:
  aux_o2m_enabled: true
  aux_o2m_weight: 1.0
  aux_o2m_head_vis: PPYOLOEHead
  aux_o2m_head_ir: PPYOLOEHead

PPYOLOEHead:
  fpn_strides: [8, 16, 32]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 30
  use_varifocal_loss: true
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner: {name: ATSSAssigner, topk: 9}
  assigner: {name: TaskAlignedAssigner, topk: 13, alpha: 1.0, beta: 6.0}
  nms: {name: MultiClassNMS, nms_top_k: 1000, keep_top_k: 300, score_threshold: 0.01, nms_threshold: 0.7}
