_BASE_: [
  '../datasets/aic2026_qadepth.yml',
  '../runtime_aic2026.yml',
  '_base_/optimizer.yml',
  '_base_/damsdet_r50vd.yml',
  '_base_/damsdet_qadepth_reader.yml',
]

# E0 contract: official, uncompressed RGB+IR DAMSDet at 640 evaluation size.
# Keep the reader/optimizer/schedule identical to E2; the Depth tensors decoded
# by the shared reader are deliberately ignored by this official architecture.
save_dir: output/E0_RGBIR_DAMSDet_640
output_eval: output/E0_RGBIR_DAMSDet_640/eval_latest
pretrain_weights: weights/coco_pretrain_weights.pdparams
classwise: true
seed: 2026

find_unused_parameters: True
log_iter: 20
snapshot_epoch: 8
epoch: 72

LearningRate:
  base_lr: 0.0001
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [48, 64]
    use_warmup: true
  - !LinearWarmup
    start_factor: 0.001
    steps: 1000
